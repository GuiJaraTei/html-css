<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Midias em HTML5</title>
</head>
<body>

    <picture>
        <source media="(max-width: 550px)" srcset="img/foto-300.jpeg" type="image/jpeg">
        <source media="(max-width: 950px)" srcset="img/foto-700.jpeg" type="image/jpeg">
        <img src="img/foto-1000.jpeg" alt="imagem de uma paisagem">
    </picture>
</body>
</html>
